<!doctype html>
<!-- Bold-checkerboard gate probe for secondary-ray texture tiles (v0.11.0).
     The high-contrast checker + orange corner marker make refraction, inversion,
     and the no-tiles failure mode (featureless beige disc) obvious at a glance.
     Kept as a regression asset: WebKit/iPad gates load this page. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiles probe: glass sphere, bold checker</title>
<style>body{margin:0;background:#07090d}#hud{position:fixed;top:8px;left:8px;color:#eee;font:13px monospace;background:rgba(0,0,0,.7);padding:6px 10px;white-space:pre;z-index:5}</style>
</head>
<body>
<div id="hud">booting</div>
<script type="module">
import * as THREE from "three";
import { RealtimeRaytracer } from "/src/index.js";

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07090d);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 60);
camera.position.set(0, 0, 1.3);
camera.lookAt(0, 0, -6);

function checkerTexture() {
  const cols = 12, rows = 8, cell = 64;
  const cv = document.createElement("canvas");
  cv.width = cols * cell; cv.height = rows * cell;
  const g = cv.getContext("2d");
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    g.fillStyle = (x + y) % 2 ? "#10141b" : "#d9d4c7";
    g.fillRect(x * cell, y * cell, cell, cell);
  }
  g.fillStyle = "#ff7a2f";
  g.fillRect(9, 9, 110, 110);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(11, 7),
  new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveMap: checkerTexture(), emissiveIntensity: 1.5, roughness: 1 })
);
backdrop.position.set(0, 0, -6);
scene.add(backdrop);

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(0.55, 48, 32),
  new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.02, metalness: 0, transmission: 1.0, ior: 1.52 })
);
sphere.position.set(0, 0, -1.6);
scene.add(sphere);

const key = new THREE.PointLight(0xfff2dc, 26, 0, 2);
key.position.set(1.7, 1.5, 0.7);
key.userData.rtRadius = 0.12;
scene.add(key);

const rt = new RealtimeRaytracer(renderer, {
  renderScale: 0.5,
  envColor: new THREE.Color(0.05, 0.06, 0.09),
  envIntensity: 0.5,
  textureTiles: true,
});
rt.compileScene(scene);
const db = renderer.getDrawingBufferSize(new THREE.Vector2());
rt.setSize(db.x, db.y);

const hud = document.getElementById("hud");
let frames = 0, last = performance.now(), fps = 0;
renderer.setAnimationLoop(() => {
  rt.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - last > 500) { fps = Math.round(frames * 1000 / (now - last)); frames = 0; last = now; }
  if (fps || frames % 30 === 0) {
    const s = rt.status || {};
    hud.textContent = `fps=${fps}\ntiles=${rt.textureTiles}\nok=${s.ok}\ndisabled=${JSON.stringify(s.disabled ?? [])}\ncoreFailure=${JSON.stringify(s.coreFailure ?? null)}`;
  }
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  const d = renderer.getDrawingBufferSize(new THREE.Vector2());
  rt.setSize(d.x, d.y);
});
</script>
</body>
</html>
