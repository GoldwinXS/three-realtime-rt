<!doctype html>
<!--
  Minimal three-realtime-rt smoke test. Deliberately contains NOTHING from the
  studio: one box, one directional light, a plain renderer, default tracer
  options. If this renders, the library is fine here and the fault is in how the
  studio drives it. If this dies the same way, the fault is below the app.
  Open /static/rtmin.html; drive it from viewer/tools/rtshot.mjs --url=...
-->
<meta charset="utf-8">
<title>rt minimal</title>
<style>html,body{margin:0;background:#05060a;overflow:hidden}canvas{display:block}</style>
<!-- bare imports: Vite resolves these from node_modules -->
<script type="module">
import * as THREE from 'three';

const log = [];
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060a);
const camera = new THREE.PerspectiveCamera(45, 4 / 3, 0.1, 100);
camera.position.set(3, 2.5, 3);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(480, 360, false);
document.body.appendChild(renderer.domElement);

// The simplest possible lit scene: one box, one directional light.
scene.add(new THREE.Mesh(
  new THREE.BoxGeometry(1.5, 1.5, 1.5),
  new THREE.MeshStandardMaterial({ color: 0xcc5533, roughness: 0.6 }),
));
scene.add(new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9 }),
).translateY(-0.75));
const d = new THREE.DirectionalLight(0xffffff, 2.0);
d.position.set(2, 3, 1.5);
scene.add(d);

const gl = renderer.getContext();
renderer.domElement.addEventListener('webglcontextlost', (e) => {
  log.push('webglcontextlost statusMessage=' + (e.statusMessage || '(none)'));
});

let rt = null, ctorError = null;
const t0 = performance.now();
try {
  const mod = await import('three-realtime-rt');
  const RT = mod.RealtimeRaytracer || (mod.default && mod.default.RealtimeRaytracer);
  log.push('import ok in ' + Math.round(performance.now() - t0) + 'ms, RT=' + typeof RT);
  // ?opts=<json> lets the harness measure how tracer FEATURES affect the
  // first-frame shader compile (the megakernel's size scales with them).
  let opts = {};
  try {
    const q = new URLSearchParams(location.search).get('opts');
    if (q) opts = JSON.parse(q);
  } catch (e) { log.push('bad ?opts: ' + e); }
  log.push('opts=' + JSON.stringify(opts));
  const t1 = performance.now();
  rt = new RT(renderer, opts);
  log.push('constructed in ' + Math.round(performance.now() - t1) + 'ms'
    + ' supported=' + rt.supported
    + ' lostAfterCtor=' + gl.isContextLost());
} catch (e) {
  ctorError = String(e && e.stack || e);
  log.push('CTOR THREW: ' + ctorError);
}

window.__min = {
  log, ctorError,
  get lost() { return gl.isContextLost(); },
  get supported() { return rt ? rt.supported : null; },
  renderOnce() {
    const t = performance.now();
    try {
      if (rt && rt.supported) rt.render(scene, camera); else renderer.render(scene, camera);
      return { ok: true, ms: Math.round(performance.now() - t), lost: gl.isContextLost() };
    } catch (e) { return { ok: false, err: String(e), ms: Math.round(performance.now() - t), lost: gl.isContextLost() }; }
  },
  readPixels() {
    const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
    const px = new Uint8Array(w * h * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    return { w, h, px };
  },
};
// Same shape as the studio's handle so rtshot can drive this page too.
window.__studio = {
  scene, camera, renderer, THREE,
  get rt() { return rt; },
  get rtActive() { return !!rt; },
  groups: () => ({ partGroup: { children: [1] }, deformedGroup: { children: [1] } }),
  renderOnce: () => (window.__min.renderOnce().ok ? 'rt' : 'failed'),
  readPixels: () => window.__min.readPixels(),
};
</script>
