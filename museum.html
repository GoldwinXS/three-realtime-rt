<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>three-realtime-rt · tour stop 2: the museum</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f16; }
    #app { width: 100%; height: 100%; }
    #app canvas { display: block; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      z-index: 50; color: #cfe0ea; font: 14px/1.5 ui-monospace, "SF Mono", Consolas, monospace;
      background: radial-gradient(circle at 50% 40%, #17212c 0%, #0a0f16 70%);
      transition: opacity 0.3s; text-align: center; padding: 20px;
    }
    #boot.hidden { opacity: 0; pointer-events: none; }
    #boot .hero { display: flex; flex-direction: column; align-items: center; gap: 13px; max-width: 640px; }
    #boot .mark { width: 44px; height: 44px; color: #38d0e0; opacity: 0.9; }
    #boot .kicker { margin: 0; font-size: 11px; letter-spacing: 3.2px; color: #7fd8c8; text-transform: uppercase; }
    #boot h1 { margin: 0; font-size: clamp(26px, 4.6vw, 36px); line-height: 1.14; font-weight: 600;
      color: #eef4f8; letter-spacing: 0.2px; }
    #boot .lede { margin: 0; font-size: 13px; line-height: 1.6; color: #a9bcc9; max-width: 500px; }
    #boot .status { display: flex; align-items: center; gap: 11px; margin-top: 4px; color: #d7e0e6;
      background: rgba(14,18,24,0.72); border: 1px solid #26323c; border-radius: 999px;
      padding: 7px 16px 7px 9px; font-size: 13px; }
    #boot .spin { width: 18px; height: 18px; border: 2px solid #223240; border-top-color: #38d0e0;
      border-radius: 50%; animation: spin 0.9s linear infinite; }
    #boot .bar { position: relative; width: min(300px, 66vw); height: 3px; border-radius: 2px;
      background: rgba(56,208,224,0.13); overflow: hidden; }
    #boot .bar i { position: absolute; top: 0; left: 0; bottom: 0; width: 38%;
      background: linear-gradient(90deg, transparent, #38d0e0, transparent);
      animation: sweep 1.1s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(330%); } }
    #boot .cue { margin: 2px 0 0; font-size: 11px; letter-spacing: 0.4px; color: #6f8494; }
    #boot .err { color: #ff8a80; max-width: 520px; white-space: pre-wrap; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) {
      #boot .lede { font-size: 12px; }
      #boot .kicker { letter-spacing: 2.4px; font-size: 10px; }
    }
    /* mobile legibility overrides for the shared tour/panel chrome. The chrome
       itself is built by examples/tour.js and examples/panel.js (shared with the
       other tour stops), so these are page-scoped wins for THIS stop: body-scoped
       selectors out-specify the injected rules and make the phone UI readable and
       thumb-safe without touching the shared modules. */
    @media (max-width: 700px) {
      body #fps { font-size: 13px; padding: 6px 13px; }
      /* clear the mobile OS home indicator / gesture zone, and give the stacked
         tour bar (RT switch + nav + dots + costs) room to breathe so the
         controls stop looking like one cramped cluster */
      body #tour { bottom: 26px; }
      body #tour .bar { gap: 11px; }
      body #tour .nav a, body #tour .nav span.stop { padding: 10px 11px; font-size: 13px; }
      body #tour .rtsw { padding: 9px 14px; }
      body #tour .dots { margin-bottom: 2px; gap: 8px; }
      body #tour .dots a.costs { padding: 4px 9px; margin-left: 10px; }
      body #tour .nav .stop b { color: #b6f2d6; }
    }
    /* tone down the shared tour's bright cyan RT-on pill so the scene keeps the
       focus (the critic: "the bright cyan RAY TRACING ON button is overly
       dominant") */
    body #tour .rtsw.on { background: rgba(47, 194, 212, 0.72); }
  </style>
  <script type="module" crossorigin src="./assets/modulepreload-polyfill-B5Qt9EMX.js"></script>
  <script type="module" crossorigin src="./assets/RealtimeRaytracer-Bb3iMtd4.js"></script>
  <script type="module" crossorigin src="./assets/OrbitControls-BlBZCci6.js"></script>
  <script type="module" crossorigin src="./assets/Duck-Dacmoewm.js"></script>
  <script type="module" crossorigin src="./assets/DamagedHelmet-Ra207Cae.js"></script>
  <script type="module" crossorigin src="./assets/scene-CNZ4TK05.js"></script>
  <script type="module" crossorigin src="./assets/tour-COu05XmT.js"></script>
  <script type="module" crossorigin src="./assets/main-DYm0NRtu.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="boot">
    <div class="hero">
      <p class="kicker">three-realtime-rt</p>
      <h1>One room, every feature</h1>
      <p class="lede">Global illumination, tinted glass, subsurface scattering and thousands of ray traced shadows, all running in a single lit room.</p>
      <div class="status"><div class="spin"></div><div id="boot-msg">preparing the ray tracer…</div></div>
      <div class="bar"><i></i></div>
      <p class="cue">drag to orbit · scroll to zoom · open the panel to explore</p>
    </div>
  </div>
</body>
</html>
